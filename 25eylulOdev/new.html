<!doctype html>
<!-- Tarayıcıya (Chrome, Safari vb.) "Bu bir HTML5 (en güncel web dili) belgesidir" diyoruz. -->
<html lang="en">
  <!-- Tüm web sayfasını kapsayan ana etikettir. lang="en" dilin İngilizce olduğunu belirtir. -->
  <head>
    <!-- Sitenin arama motorlarına ve tarayıcıya verdiği görünmez bilgilerin (başlık, karakter ayarı) bulunduğu kısımdır. -->
    <meta charset="UTF-8" />
    <!-- Türkçe karakterlerin (ş, ğ, ç, ö vb.) sitede bozuk çıkmaması için evrensel karakter setini (UTF-8) kullanmasını söyler. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Sitenin telefon, tablet veya bilgisayarlarda ekrana tam oturmasını (mobil uyumlu olmasını) sağlar. -->
    <title>Sipariş & Gelir Kokpit Dashboard</title>
    <!-- title: Tarayıcının en üstündeki sekmede yazacak olan site ismidir. -->
    <link rel="stylesheet" href="css/new.css">
    <!-- Sayfanın renkleri ve tasarımlarının olduğu harici bir CSS dosyasını (css klasöründeki new.css) sayfamıza bağlar. -->
  </head>
  <body>
    <!-- body: Ekranda gördüğümüz HER ŞEY bu body etiketleri arasında yer alır. -->
    <div class="kokpit">
      <!-- <div> (division): Sayfayı bölümlere ayırmak için kullanılan içi boş bir kutudur. 
         class="kokpit": CSS dosyasının bu kutuyu "kokpit" tasarımıyla süslemesini sağlar. -->
      <header class="header">
        <!-- <header>: Sayfanın tepe (başlık) kısmını belirtmek için kullanılan bir kutudur (div ile aynı işi yapar ama ismi daha anlamlıdır). -->
        <span class="header__tag"> Sipariş Takip </span>
        <!-- <span>: Kutu oluşturmadan, sadece bir metnin bir kısmını gruplamak/renklendirmek için kullanılan etikettir. -->
        <h1 class="header_title">Sipariş Yönetim Kokpiti</h1>
        <!-- <h1>: Sayfanın en büyük ve en önemli ana başlığıdır (Heading 1). Her sayfada tek bir h1 olabilir.-->
      </header>
      <section class="kpi-grid">
        <!-- <section>: Sitenin belirli bir konusunu/bölümünü gruplayan kutudur. Burada "Bilgi kartları bölümü" anlamında kullanılmış. -->
        <div class="kpi-card">
          <span>Kayıtlı Sipariş</span>
          <h3 id="kpiCount">0</h3>
        </div>
        <div class="kpi-card">
          <span>Toplam Sipariş Tutarı: </span>
          <h3 id="kpiTotal">0 ₺</h3>
        </div>
        <div class="kpi-card">
          <span>Ortalama Ürün Fiyatı</span>
          <h3 id="kpiAvg">0 ₺</h3>
        </div>
      </section>
      <main class="layout">
        <!-- <main>: Sitenin asıl içeriğinin olduğu ana gövde bölümüdür. -->
        <section class="panel">
          <h4>Yeni Sipariş Kaydı</h4>
          <form id="orderForm">
            <!-- <form>: Kullanıcıdan bilgi (yazı, şifre, seçim) alacağımız alanı tanımlar. -->
            <div class="field">
              <label for="prodName">Ürün Adı: </label>
              <!-- <label>: Kullanıcıya ne girmesi gerektiğini söyleyen metin etiketi. -->
              <input type="text" id="prodName" placeholder="Sehpa" required />
              <!-- <input>: Kullanıcının yazı yazabildiği kutucuktur.
                   type="text": İçine metin girileceğini belirtir.
                   placeholder="Sehpa": Kutu boşken silik görünen örnek yazıdır.
                   required: Bu kutu boş bırakılırsa formun gönderilmesini engeller (zorunlu alan). -->
            </div>
            <div class="field">
              <label for="prodCat">Kategori</label>
              <select name="prodCat" id="prodCat">
                <!-- <select>: Kullanıcının tıklayıp liste içinden seçim yaptığı açılır menüdür (Dropdown). -->
                <option value="Mobilya">Mobilya</option>
                <!-- <option>: Açılır menüdeki tıklanabilir seçeneklerdir. -->
                <option value="Aydınlatma">Aydınlatma</option>
                <option value="Mutfak">Mutfak</option>
              </select>
            </div> 
            <div class="field">
              <label for="prodPrice">Fiyat</label>
              <input
                type="number"
                id="prodPrice"
                value="3250"
                min="100"
                step="50"
                required
              />
              <!-- type="number": Sadece rakam girilmesini sağlar (Harf yazılamaz).
                   value="3250": Kutuya baştan varsayılan olarak bu sayıyı yazar.
                   min="100": Girilebilecek en küçük sayı 100 olmalıdır.
                   step="50": Sayı artırma oklarına basılınca 50'şer 50'şer artıp azalmasını sağlar. -->
            </div>
            <button type="submit" class="btn-submit">Siparişi Kaydet</button>
            <!-- <button>: Tıklanabilir butondur. type="submit" olduğu için formu onaylar. -->
          </form>
        </section>
        <section class="panel">
          <div class="filter-bar">
            <input
              type="text"
              id="searchInput"
              class="field"
              placeholder="Ürün Adına Göre Filtrele"
            />
            <select
              id="categoryFilter"
            >
              <option value="ALL">Tüm Kategoriler</option>
              <option value="Mobilya">Mobilya</option>
              <option value="Aydınlatma">Aydınlatma</option>
              <option value="Mutfak">Mutfak</option>
            </select>
          </div>
          <div id="orderContainer" class="order-list">
          </div>
        </section>
      </main>
      <script> 
      // <script>: Sitenin beynidir. Matematiksel işlemler, tıklama olayları ve hesaplamalar burada yapılır.

        // let: İçi sonradan değiştirilebilen bir değişken (kutu) oluşturur.
        // orders: İçinde siparişlerimizin olduğu bir "Dizi" (Array) listesidir. Köşeli parantez [] liste demektir.
        // Süslü parantezler {} ise bir objeyi (birden çok özelliği olan tek bir nesneyi) temsil eder.
        let orders = [
          { id: 1, name: "Sehpa", category: "Mobilya", price: 6500 },
          { id: 2, name: "Abajür", category: "Aydınlatma", price: 7500 },
          { id: 3, name: "Koltuk", category: "Mobilya", price: 8500 },
          { id: 4, name: "Bulaşık Makinası", category: "Mutfak", price: 10000 },
          { id: 5, name: "Ocak", category: "Mutfak", price: 15000 },
        ];
        // const: Sabit değişkendir. İçi sonradan değiştirilemez.
        // document.getElementById("..."): "Git HTML içinden şu ID'ye sahip elemanı bul ve buraya getir" komutudur.
        const orderContainer = document.getElementById("orderContainer");
        const orderForm = document.getElementById("orderForm");
        const searchInput = document.getElementById("searchInput");
        const categoryFilter = document.getElementById("categoryFilter");
        const kpiCount = document.getElementById("kpiCount");
        const kpiTotal = document.getElementById("kpiTotal");
        const kpiAvg = document.getElementById("kpiAvg");
        
        const updateKPIs = (dataList) => {
          // updateKPIs: Sayıları güncelleyen iş emri (fonksiyon). dataList adında bir paket alır.
          kpiCount.textContent = dataList.length;
          // Listedeki eleman sayısını (length) bul ve kpiCount isimli h3 etiketinin içine metin (textContent) olarak yaz.

          if (dataList.length === 0) {
            kpiTotal.textContent = "0 ₺";
            kpiAvg.textContent = "0 ₺";
            return;
            // return: Burada işlemi bitir, kodun aşağısına devam etme demektir.
          }
          const total = dataList.reduce((acc, curr) => acc + curr.price, 0);
          // reduce: Listeyi tarayıp tüm fiyatları toplar. (acc = toplam hafızası, curr = o anki ürünün fiyatı)
          kpiTotal.textContent = `${total.toLocaleString("tr-TR")} ₺`;
 // toLocaleString("tr-TR"): "15000" sayısını "15.000" şeklinde araya nokta koyarak okunabilir yapar.
          // Backtick (``) sembolleri içine değişken ve normal yazı aynı anda yazabilmemizi sağlar (${total} gibi).
          const avg = total / dataList.length;
          kpiAvg.textContent = `${Math.round(avg).toLocaleString("tr-TR")} ₺`;
          // Math.round: Sayıyı (örn: 3333.33) en yakın tam sayıya yuvarlar.
        };

        const renderOrders = () => {
          // renderOrders: HTML'deki boş orderContainer kutusunun içine ürünleri basan fonksiyondur.
          const term = searchInput.value.toLowerCase().trim();
          // Arama kutusuna yazılan yazıyı al (.value), küçült (toLowerCase) ve kenarlarındaki boşlukları sil (trim).
          const selectedCat = categoryFilter.value;
          // Seçili kategoriyi (Mobilya vs) al.

          const filtered = orders.filter((order) => {
            // filter: Mevcut tüm ürünlerin içinden koşula uyanları filtreleyip ayırır.
            const matchesName = order.name.toLowerCase().includes(term);
            // Ürün isminin içinde, bizim arama kutusuna yazdığımız yazı (term) var mı (includes)?
            const mathesCategory =
              selectedCat === "ALL" || order.category === selectedCat;
              // Kategori "ALL" (Tümü) mü veya seçtiğimiz kategori ürünün kendi kategorisiyle aynı mı?
            return matchesName && mathesCategory;
          });

          orderContainer.innerHTML = "";

          if (filtered.length === 0) {
            orderContainer.innerHTML = `
            <div class="empty-state">
            Kriterlere Uygun Ürün Bulunamadı
            </div>
            `;
            // Boş bir liste ( [] ) göndererek sayıları 0'a çek.
            updateKPIs([]);
            return;
          }

          filtered.forEach((order) => {
            // Filtrelenmiş listedeki HER BİR ürün için (forEach) şu işlemleri yap:
            const item = document.createElement("article");
            // Hafızada sanal bir <article> (makale/kart) HTML elementi oluştur.
            item.className = "order-item";
            item.setAttribute("data-id", order.id);
            const badgeClass =
              order.category === "Mobilya"
                ? "badge--mobilya"
                : order.category === "Aydınlatma"
                  ? "badge--aydinlatma"
                  : "badge--seramik";

            item.innerHTML = `
                <div>
                <h5>${order.name}</h5>
                <p>Birim Fiyat: ${order.price.toLocaleString("tr-TR")} ₺</p>
                </div>
                <div class="meta-box">
                <span class="badge ${badgeClass}">${order.category}</span>
                <button class="btn-del" data-action="delete">Sil</button>
                </div>
                `;
            orderContainer.appendChild(item);
            // Hafızada oluşturduğumuz bu dolu HTML kartını, sayfadaki gerçek container kutusuna yerleştir.
            updateKPIs(filtered);
            // Sayıları/Hesaplamaları son duruma göre güncelle.
          });
        };

        searchInput.addEventListener("input", renderOrders);
        // addEventListener("input", ...): Arama çubuğuna klavyeden her harf girildiğinde renderOrders'ı çalıştır.
        categoryFilter.addEventListener("change", renderOrders);
        // addEventListener("change", ...): Kategoriyi (Açılır menüyü) değiştirdiğimiz an renderOrders'ı çalıştır.

        orderContainer.addEventListener("click", (e) => {
          if (e.target.getAttribute("data-action") === "delete") {
            // e.target: Fareyle tam olarak nereye tıklandığıdır. Eğer tıklanan yer "delete" (Sil) butonuysa:
            const item = e.target.closest(".order-item");
            // closest(".order-item"): Butonun içinde bulunduğu ana kart kutusunu bul.
            const orderId = parseInt(item.getAttribute("data-id"));
            // O karttaki ID'yi alıp sayıya (parseInt) çevir.
            orders = orders.filter((order) => order.id !== orderId);
            // orders listesinde, sadece bu sildiğimiz ID'ye SAHİP OLMAYANLARI bırak (Yani o ürünü silmiş olduk).
            renderOrders();
            // Listeyi yeniden çizdir.
          }
        });

        orderForm.addEventListener("submit", (e) => {
          e.preventDefault();
          // e.preventDefault(): Form gönderildiğinde sayfanın "F5" yapıp yenilenmesini (refresh) ENGELLER. Sitenin anlık çalışmasını sağlar.
          
          const nameInput = document.getElementById("prodName").value;
          const catInput = document.getElementById("prodCat").value;
          const priceInput = parseInt(document.getElementById("prodPrice").value);
          // Kutulara yazılan değerleri al.

          const newOrder = {
            id: Date.now(),
            name: nameInput,
            category: catInput,
            price: priceInput
          };
          // Yeni bir ürün objesi oluştur.

          orders.push(newOrder);
          // Bu yeni ürünü ana listeye (orders) fırlat/ekle (push).
          renderOrders();
          
          orderForm.reset();
          // Formun içindeki yazı ve rakamları temizle (formu sıfırla).
          document.getElementById("prodPrice").value = "3250";
          // Fiyat kutusuna varsayılan olarak tekrar 3250 yaz.
        });

        renderOrders();
        // SİTE İLK AÇILDIĞINDA her şeyi bir kez ekrana çizdirmek için fonksiyonu manuel olarak bir kere çalıştırıyoruz.
      </script>
    </div>
  </body>
</html>
