<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Softito Mobil Geliştirici Portalı</title>
    <link rel="stylesheet" href="css/mobil_gelistirici_portali.css">
</head>
<body>
    <header class="dashboard-header">
        <div class="live-badge">
            <span class="pulse-dot"></span>
            <span>Eğitim Sistemi Aktif</span>
        </div>
        <h1>Softito Mobil Geliştirici Portalı</h1>
        <p class="subtitle">Eğitim İstatistikleri ve Metrikler</p>
    </header>
    <main class="dashboard-grid">
        <div class="glass-card">
            <div class="card-top">
                <span class="card-label">Tamamlanan Gün</span>
                <div class="card-icon">📅</div>
            </div>
            <div class="card-val">12 / 17</div>
            <div class="card-footer">Flutter Mobil Developer</div>
        </div>
        <div class="glass-card">
            <div class="card-top">
                <span class="card-label">Yapılan Ödev Sayısı</span>
                <div class="card-icon">📝</div>
            </div>
            <div class="card-val">9</div>
            <div class="card-footer" style="color: var(--success);">Tümü GitHub'a Yüklendi</div>
        </div>
        <div class="glass-card">
            <div class="card-top">
                <div class="skeleton skeleton-text-small"></div>
                <div class="skeleton skeleton-icon"></div>
            </div>
            <div class="skeleton skeleton-text-large"></div>
            <div class="skeleton skeleton-text-medium"></div>
        </div>
    </main>

</body>
</html>
